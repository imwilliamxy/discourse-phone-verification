plugins:
  phone_verification_enabled:
    default: false
    client: true
    type: bool
  phone_verification_min_trust_level:
    default: 1
    client: true
    type: enum
    choices:
      - 0
      - 1
      - 2
      - 3
      - 4
  phone_verification_group_name:
    default: "phone_verified"
    type: string
  phone_verification_sms_provider:
    default: "aws_sns"
    type: enum
    choices:
      - aws_sns
      - twilio
  phone_verification_aws_region:
    default: "us-east-1"
    type: string
    depends_on:
      - phone_verification_sms_provider
    depends_on_values:
      phone_verification_sms_provider:
        - aws_sns
    depends_behavior: "hidden"
  phone_verification_aws_access_key_id:
    default: ""
    type: string
    secret: true
    depends_on:
      - phone_verification_sms_provider
    depends_on_values:
      phone_verification_sms_provider:
        - aws_sns
    depends_behavior: "hidden"
  phone_verification_aws_secret_access_key:
    default: ""
    type: string
    secret: true
    depends_on:
      - phone_verification_sms_provider
    depends_on_values:
      phone_verification_sms_provider:
        - aws_sns
    depends_behavior: "hidden"
  phone_verification_sms_sender_id:
    default: ""
    type: string
    depends_on:
      - phone_verification_sms_provider
    depends_on_values:
      phone_verification_sms_provider:
        - aws_sns
    depends_behavior: "hidden"
  phone_verification_twilio_account_sid:
    default: ""
    type: string
    secret: true
    depends_on:
      - phone_verification_sms_provider
    depends_on_values:
      phone_verification_sms_provider:
        - twilio
    depends_behavior: "hidden"
  phone_verification_twilio_auth_token:
    default: ""
    type: string
    secret: true
    depends_on:
      - phone_verification_sms_provider
    depends_on_values:
      phone_verification_sms_provider:
        - twilio
    depends_behavior: "hidden"
  phone_verification_twilio_from_phone_number:
    default: ""
    type: string
    depends_on:
      - phone_verification_sms_provider
    depends_on_values:
      phone_verification_sms_provider:
        - twilio
    depends_behavior: "hidden"
  phone_verification_twilio_messaging_service_sid:
    default: ""
    type: string
    depends_on:
      - phone_verification_sms_provider
    depends_on_values:
      phone_verification_sms_provider:
        - twilio
    depends_behavior: "hidden"
  phone_verification_sms_daily_limit_per_user:
    default: 5
    type: integer
  phone_verification_verification_code_expiry_minutes:
    default: 10
    type: integer
  phone_verification_debug_mode:
    default: false
    client: false
    type: bool
