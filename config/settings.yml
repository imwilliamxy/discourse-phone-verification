plugins:
  phone_verification_enabled:
    default: false
    client: true
    type: bool
  phone_verification_min_trust_level:
    default: 1
    client: true
    type: enum
    choices:
      - 0
      - 1
      - 2
      - 3
      - 4
  phone_verification_group_name:
    default: "phone_verified"
    type: string
  phone_verification_sms_provider:
    default: "aws_sns"
    type: enum
    choices:
      - aws_sns
      - twilio
  phone_verification_aws_region:
    default: "us-east-1"
    type: string
    depends_on:
      - phone_verification_sms_provider
    depends_on_values:
      phone_verification_sms_provider:
        - aws_sns
    depends_behavior: "hidden"
  phone_verification_aws_access_key_id:
    default: ""
    type: string
    secret: true
    depends_on:
      - phone_verification_sms_provider
    depends_on_values:
      phone_verification_sms_provider:
        - aws_sns
    depends_behavior: "hidden"
  phone_verification_aws_secret_access_key:
    default: ""
    type: string
    secret: true
    depends_on:
      - phone_verification_sms_provider
    depends_on_values:
      phone_verification_sms_provider:
        - aws_sns
    depends_behavior: "hidden"
  phone_verification_sms_sender_id:
    default: ""
    type: string
    depends_on:
      - phone_verification_sms_provider
    depends_on_values:
      phone_verification_sms_provider:
        - aws_sns
    depends_behavior: "hidden"
  phone_verification_twilio_account_sid:
    default: ""
    type: string
    secret: true
    depends_on:
      - phone_verification_sms_provider
    depends_on_values:
      phone_verification_sms_provider:
        - twilio
    depends_behavior: "hidden"
  phone_verification_twilio_auth_token:
    default: ""
    type: string
    secret: true
    depends_on:
      - phone_verification_sms_provider
    depends_on_values:
      phone_verification_sms_provider:
        - twilio
    depends_behavior: "hidden"
  phone_verification_twilio_from_phone_number:
    default: ""
    type: string
    depends_on:
      - phone_verification_sms_provider
    depends_on_values:
      phone_verification_sms_provider:
        - twilio
    depends_behavior: "hidden"
  phone_verification_twilio_messaging_service_sid:
    default: ""
    type: string
    depends_on:
      - phone_verification_sms_provider
    depends_on_values:
      phone_verification_sms_provider:
        - twilio
    depends_behavior: "hidden"
  phone_verification_banner_enabled:
    default: false
    client: true
    type: bool
  phone_verification_banner_until:
    default: ""
    client: true
    type: string
  phone_verification_banner_text:
    default: ""
    client: true
    type: string
  phone_verification_prompt_pm_enabled:
    default: false
    type: bool
  phone_verification_send_code_min_trust_level:
    default: 1
    type: enum
    choices:
      - 0
      - 1
      - 2
      - 3
      - 4
  phone_verification_sms_daily_limit_per_user:
    default: 5
    type: integer
  phone_verification_sms_daily_limit_per_phone:
    default: 3
    type: integer
    min: 1
  phone_verification_sms_daily_limit_per_ip:
    default: 10
    type: integer
    min: 1
  phone_verification_sms_daily_limit_global:
    default: 1000
    type: integer
    min: 1
  phone_verification_verification_code_expiry_minutes:
    default: 10
    type: integer
  phone_verification_debug_mode:
    default: false
    client: false
    type: bool
  phone_verification_block_disposable:
    default: true
    client: false
    type: bool
  phone_verification_disposable_list_url:
    default: "https://cdn.jsdelivr.net/gh/iP1SMS/disposable-phone-numbers@master/number-list.json"
    type: string
    depends_on:
      - phone_verification_block_disposable
    depends_on_values:
      phone_verification_block_disposable:
        - true
    depends_behavior: "hidden"
  phone_verification_custom_disposable_numbers:
    default: ""
    type: list
    list_type: compact
    depends_on:
      - phone_verification_block_disposable
    depends_on_values:
      phone_verification_block_disposable:
        - true
    depends_behavior: "hidden"
  phone_verification_block_voip:
    default: false
    client: false
    type: bool
  phone_verification_lookup_cache_ttl_days:
    default: 30
    type: integer
    min: 1
    max: 365
    depends_on:
      - phone_verification_block_voip
    depends_on_values:
      phone_verification_block_voip:
        - true
    depends_behavior: "hidden"
