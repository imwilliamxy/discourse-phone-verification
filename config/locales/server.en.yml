    phone_verification_enabled: "Enable the Phone Verification plugin (+1 SMS verification). Recommended to install discourse-dynamic-groups for advanced dynamic group gatekeeping."
    phone_verification_min_trust_level: "Minimum Trust Level required for category gatekeeper group access."
    phone_verification_group_name: "Name of the Discourse group to automatically manage for verified users."
    phone_verification_sms_provider: "SMS gateway provider (e.g. AWS SNS, Twilio)."
    phone_verification_aws_region: "AWS Region for Amazon SNS."
    phone_verification_aws_access_key_id: "AWS Access Key ID (leave empty to use IAM role)."
    phone_verification_aws_secret_access_key: "AWS Secret Access Key."
    phone_verification_sms_sender_id: "Optional SMS Sender ID (where supported by AWS)."
    phone_verification_twilio_account_sid: "Twilio Account SID."
    phone_verification_twilio_auth_token: "Twilio Auth Token."
    phone_verification_twilio_from_phone_number: "Twilio Sender Phone Number in E.164 format (e.g. +14155552671)."
    phone_verification_twilio_messaging_service_sid: "Optional Twilio Messaging Service SID (MG...)."
    phone_verification_banner_enabled: "Show a site-wide banner to users who have reached the minimum trust level but haven't verified a phone number, linking to the verification page. Meant for the transition period when a category starts requiring phone verification."
    phone_verification_banner_until: "Last day the banner is shown, in YYYY-MM-DD format. Leave empty to show it with no end date. An invalid date hides the banner."
    phone_verification_banner_text: "Banner text. Leave empty to use the default text. Plain text only."
    phone_verification_prompt_pm_enabled: "Send a personal message to users when they are promoted to the minimum trust level without a verified phone number. Each user gets it at most once. The message can be edited under Customize > Text (system_messages.phone_verification_required)."
    phone_verification_send_code_min_trust_level: "Minimum Trust Level required to request an SMS verification code. Staff are always allowed. Keeps freshly registered accounts from being used to send SMS."
    phone_verification_sms_daily_limit_per_user: "Maximum SMS verification codes a user can request per day."
    phone_verification_sms_daily_limit_per_phone: "Maximum SMS verification codes sent to the same phone number per day, across all accounts."
    phone_verification_sms_daily_limit_per_ip: "Maximum SMS verification codes requested from the same IP address per day."
    phone_verification_sms_daily_limit_global: "Maximum SMS verification codes sent per day for the whole site. Caps SMS spending if limits are bypassed with many accounts."
    phone_verification_verification_code_expiry_minutes: "Verification code expiration time in minutes."
    phone_verification_debug_mode: "Enable debug mode. When enabled, actual SMS dispatch is bypassed (no SMS gateway API calls and no daily limits), and any 6-digit verification code will be accepted (for development/testing only). On production servers it only takes effect if the container env also sets DISCOURSE_PHONE_VERIFICATION_ALLOW_DEBUG_MODE=true."
    phone_verification_block_disposable: "Block temporary disposable phone numbers from public receive-SMS platforms using the open-source iP1SMS/disposable-phone-numbers database and custom blocklist."
    phone_verification_disposable_list_url: "Remote URL of the disposable phone numbers JSON dataset (e.g. jsDelivr CDN or GitHub Raw)."
    phone_verification_custom_disposable_numbers: "Custom list of blocked phone numbers separated by '|' (e.g. +14155550199|+14155550188)."
    phone_verification_block_voip: "Block virtual phone numbers (VoIP, such as Google Voice, TextNow, Skype) and landlines using real-time carrier line-type intelligence."
    phone_verification_lookup_cache_ttl_days: "Number of days to cache phone line type intelligence lookup results in Redis to avoid redundant API fees."
  dashboard:
    problem:
      phone_verification_missing_dynamic_groups: "The Phone Verification plugin is enabled, but the recommended companion plugin <a href='https://github.com/communiteq/discourse-dynamic-groups' target='_blank'>discourse-dynamic-groups</a> is not installed. Dynamic group calculation and advanced category gatekeeping rules will not be active."
  system_messages:
    phone_verification_required:
      title: "Phone verification needed"
      subject_template: "Verify your phone number to access trust level %{trust_level} categories"
      text_body_template: |
        Congratulations on reaching trust level %{trust_level}!

        Some categories for trust level %{trust_level} members are only open to members who have verified a US (+1) mobile phone number. You can verify yours on your [account preferences page](%{verify_url}).

        Your number is never shown to other members.
  phone_verification:
    sms_message: "Your %{site_title} verification code is %{code}. Valid for %{expiry} minutes."
    errors:
      plugin_disabled: "Phone verification is currently disabled."
      invalid_phone_number: "Please enter a valid US (+1) 10-digit phone number."
      phone_already_used: "This phone number is already registered to another active account."
      cooldown_active: "Please wait %{seconds} seconds before requesting another verification code."
      daily_limit_exceeded: "Daily SMS limit reached. Please try again tomorrow."
      trust_level_too_low: "You need to reach trust level %{trust_level} before verifying a phone number."
      sms_send_failed: "Unable to send the verification code right now. Please try again later."
      invalid_code: "Invalid or expired verification code."
      too_many_attempts: "Too many failed attempts. Please request a new verification code."
      not_verified: "No active phone verification found for this account."
      disposable_phone_blocked: "Disposable or temporary receive-SMS phone numbers are not allowed. Please use a personal mobile phone number."
      voip_phone_blocked: "Virtual (VoIP) or landline phone numbers (such as Google Voice or TextNow) are not allowed. Please use a physical carrier mobile number."
      lookup_failed: "Unable to verify carrier information for this phone number. Please try again later."
